[pytest]
# Test modules are named `*_tests.py` (plural) because the containerised
# `healthcheck` command in the base evaluation-function layer imports them as
# `evaluation_tests` / `preview_tests`. Default pytest discovery only matches
# `*_test.py` / `test_*.py`, so widen it here to keep CI collection working.
python_files = *_test.py *_tests.py test_*.py
testpaths = app
